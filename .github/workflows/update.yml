name: تحديث الأخبار

on:
  schedule:
    - cron: '*/5 * * * *'   # كل ٥ دقائق (أقل مدة يسمح فيها قيت هاب)
  workflow_dispatch:         # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: جلب وترجمة
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "نسخة الكود: $(git log -1 --format=%h)"
          node scripts/fetch.mjs

      - name: حفظ التحديث
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "تحديث الأخبار" && git pull --rebase && git push)
